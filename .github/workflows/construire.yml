name: Reconstruire après une modification

# Quand offres.json change (page d'édition, mise à jour quotidienne, édition sur GitHub),
# valide la base puis régénère CSV, résumé, historique, CHANGELOG et page de consultation.
on:
  push:
    branches: [main]
    paths: ["data/offres.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider
        run: python3 scripts/build.py --check
      - name: Régénérer
        run: python3 scripts/build.py
      - name: Enregistrer les fichiers régénérés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien à régénérer"; exit 0; fi
          git commit -m "Régénération automatique après modification de la base"
          git pull --rebase origin main
          git push origin main
