name: Vérifier la base des prix

on:
  push:
    paths: ["data/offres.json", "scripts/**", "site/**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider offres.json
        run: python3 scripts/build.py --check
